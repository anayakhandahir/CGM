<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="w style.css">
    <style>
        * {
            box-sizing: border-box;
            color: white;
            font-family: sans-serif;

        }
    </style>
</head>

<body>
    <center>
        <div>
            <h1>🌤️ Weather App</h1>
            <input type="text" style="color: gray;" value="Search City" id="city">
        </div>
        <section>
            <h1>Sadiqabad</h1>
            <p>Today , September 16</p>
            <div class="cloud">🌤️</div>
            <h1 class="tem">39<sup>°</sup>c</h1>
            <h3 class="su">SUNNY☀️ </h3>
        </section>
    </center>

    <div class="details">
        <div class="details-icon">💧</div><br>
        <p>Humidity</p>
        <p>91%</p>

        <div class="details-icon">👁️</div><br>
        <p>Visibility</p>
        <p>N/A</p>

        <div class="details-icon">💨</div><br>
        <p>Wind</p>
        <p>17km/h</p>
        <div class="datails-icon">🌡️</div><br>
        <p>Temperature</p>
        <p>29.84 inHg</p>
    </div>
    <h1 style="text-align: center;">7-days Forecast!</h1>
    <div class="days">
        <div class="mon">
            <h2>Mon</h2>
            <h2 class="emo">☀️</h2>
            <h3 class="i">40<sup>°</sup>c</h3>
        </div>
        <div class="tue">
            <h2>Tue</h2>
            <h2 class="emo">☀️</h2>
            <h3 class="i">42<sup>°</sup>c</h3>
        </div>
        <div class="wed">
            <h2>Wed</h2>
            <h2 class="emo">🌤️</h2>
            <h3 class="i">36<sup>°</sup>c</h3>
        </div>
        <div class="thus">
            <h2>Thus</h2>
            <h2 class="emo">☁️</h2>
            <h3 class="i">43<sup>°</sup>c</h3>
        </div>
        <div class="fri">
            <h2>Fri</h2>
            <h2 class="emo">🌦️</h2>
            <h3 class="i">36<sup>°</sup>c</h3>
        </div>
        <div class="sat">
            <h2>Sat</h2>
            <h2 class="emo">☁️</h2>
            <h3 class="i">38<sup>°</sup>c</h3>
        </div>
        <div class="Sun">
            <h2>Sun</h2>
            <h2 class="emo">☁️</h2>
            <h3 class="i">41<sup>°</sup>c</h3>
        </div>


</body>

</html>
