<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study Progress Report </title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>

<body>
    <div class="jumbotron jumbotron-fluid  text-white mb-0 px-0"
        style="background-color:lightpink; text-shadow:2px 3px 4px lightblue ">
        <div class="container">
            <h1> My Study Progress ⭐ </h1>
        </div>
    </div>
    <div class="container-fluid" style="background-color:lightpink;">
        <button class="btn btn-danger">Math</button>
        <button class="btn btn-warning">Urdu</button>
        <button class="btn btn-secondary">English</button>
        <button class="btn btn-success">Computer Science</button><br>
        <h2 style="color:white">Homework Left</h2>
        <h2>Math<span class="badge badge-danger">2 subjects </span></h2>
        <h2 style="color:white">Homework Left</h2>
        <h2>Urdu<span class="badge badge-warning">3 subjects </span></h2>
        <h2 style="color:white">Homework Left</h2>
        <h2>English<span class="badge badge-secondary"> 2 subjects </span></h2>
        <h2 style="color:white">Homework Left</h2>
        <h2>Computer Science<span class="badge badge-success">1 subject </span></h2> <br>

        <h3>Math</h3>
        <div class="progress">
            <div class="progress-bar bg-danger" style="width:77%">77%</div>
        </div>
        <h3>Urdu</h3>
        <div class="progress">
            <div class="progress-bar bg-warning" style="width:50%">50%</div>
        </div>
        <h3>English</h3>
        <div class="progress">
            <div class="progress-bar bg-secondary" style="width:55%">55%</div>
        </div>
        <h3>Computer Science</h3>
        <div class="progress">
            <div class="progress-bar bg-success" style="width:95%">95%</div>
        </div>
    </div>


</body>

</html>
