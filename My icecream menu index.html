<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My ice cream menu </title>
    <style>
        body {
            background-image: linear-gradient(white, lightpink, lightpink, white);
            min-height: 100vh;
        }

        .text:hover {
            background-color: deeppink;
        }

        .text {
            font-size: 35px;
            font-family: cursive, sans-serif;
            font-weight: bold;
            color: rgb(173, 13, 66);
            text-shadow: 3px 3px lightpink;
        }

        #be::first-letter {
            font-size: 65px;
        }


        ul>li {
            list-style: none;
            margin: 35px;
            color: rgb(255, 4, 88);
            font-size: 25px;
            font-family: Arial, Helvetica, sans-serif;
            border: 5px solid white;
            border-radius: 20px;
            padding: 5px;
        }

        h2+p {
            background-color: brown;
        }

        ul>li:hover {
            background-color: bisque;
        }

        ul>li:nth-child(4) {
            background-color: darksalmon;
        }

        button:hover {
            background-color: cadetblue;
        }

        button {
            background-color: blueviolet;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <center>
        <span class="text">My Icecream Menu🍦</span>
        <h2 style="color: cyan;" id="be">ToDAy ICeCreAm FlaVourS😋</h2>
        <p>We serve the best icecreams ENJOY!!</p>
        <ul>
            <li>Mango Sorbet</li>
            <li>Matcha Icecream</li>
            <li>Cookies & Cream</li>
            <li>Classic Strawberry</li>
            <li> Weirder </li>
            <li>Chocolate Icecream</li>
        </ul>
    </center>
    <button style> Order Now!</button>
</body>

</html>
