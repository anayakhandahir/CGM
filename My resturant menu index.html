<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Resturant Menu </title>
    <style>
        body {
            background: radial-gradient(pink, white, pink);
            background-repeat: no-repeat;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            min-height: 100vh;
            min-width: 100vw;
        }

        .my {
            font-size: 55px;
            min-width: 100vw;
            color: white;

        }

        .my {
            text-shadow: 6px 6px rgb(131, 117, 117);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .menu {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div>
        <center>
            <h1 style="color: white;" class="my">🍰My Resturant Menu🍰</h1>

        </center>
    </div>
    <div class="menu">

        <div style="display: flex; gap:150px;justify-content:space-evenly">
            <h2>.MilkShake</h2>
            <h2>200 RS</h2>
        </div><br>
        <div style="display: flex; gap:150px; justify-content:space-evenly ">
            <h2>.Waffle</h2>
            <h2>150 RS</h2>
        </div><br>


        <div style="display: flex; gap:150px; justify-content:space-evenly">
            <h2>.Moose</h2>
            <h2>300 RS</h2>
        </div><br>


        <div style="display: flex; gap:150px; justify-content:space-evenly">
            <h2>.Giant Nutella Cake</h2>
            <h2>1000 RS</h2>
        </div><br>

    </div>
    <div style="display: flex; justify-content:space-evenly">
        <h2 style=text-decoration:underline;>.Lava Cake</h2>
        <h2 style="text-decoration: line-through;">350 RS</h2>
        <h2 style="text-transform: uppercase;">Only for 200Rs.💀</h2>
    </div><br>
