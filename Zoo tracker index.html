<!DOCTYPE html>
<html>

<head>

    <style>
        body {

            color: white;

            padding-top: 70px;

        }

        div {
            border: 3px solid yellow;
        }


        .a {

            color: black;
            padding: 10px;

        #parent {
            position: relative;

        }

        #child {
            position: absolute;
            top: 0;

        }

        #fixed {
            position: fixed;
            top: 0px;
        }

        #sticky {
            position: sticky;
            top: 30px;
            margin-top: 30px;

        }
    </style>
</head>
