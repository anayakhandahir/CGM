<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My science Lab</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="jumbotron  bg-info text-white">
        <div class="container">
            <h1>My Science lab</h1>
            <p>You can see experiements and our lab progress</p>
        </div>
    </div>
    <div class="container">
    <button class="btn btn-warning">Chemistry</button>
    <button class="btn btn-secondary">Physics</button>
    <button class="btn btn-danger">Math</button>
    <button class="btn btn-success">Artifcial intelligence</button>

</div>
<div class="container">
    <h1>Our Experiements</h1>
    <p>Chemistry<span class="badge badge-warning">9</span></p>
    <p>Physics<span class="badge badge-secondary">5</span></p>
    <p>Math<span class="badge badge-danger">6</span></p>
    <p>Artificial Intelligence<span class="badge badge-success">15</span></p>
</div>
<h2>Chemistry</h2>
    <div class="progress">
        <div class="progress-bar bg-warning" style="width:87%">87%</div>
    </div>
    <h2>Physics</h2>
    <div class="progress">
        <div class="progress-bar bg-warning" style="width:55%">55%</div>
    </div>
    <h2>Math</h2>
    <div class="progress">
        <div class="progress-bar bg-warning" style="width:60%">60%</div>
    </div>
    <h2>AI</h2>
    <div class="progress">
        <div class="progress-bar bg-warning" style="width:98%">98%</div>
    </div>
</body>
</html>
