<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate Books 📚 </title>
</head>
<body>
    <h1>Donation of Books 📚 </h1>
    <form>
        <fieldset>
            <legend> Library Information  </legend>
            <label> Our library is a welcoming sanctuary built to spark curiosity and bring people together. It is a bright space where imagination comes alive and minds grow. Just remember: having fun isn't hard when you've got a library card—but finding that book you misplaced three weeks ago definitely is! 😃 </label><br>
        </fieldset>
        <label><h4>Fill the form to donate the books to the LIBRARY🏛️ </h4>  </label>
        <label> First name : </label>
        <input type="text" name ="Name" placeholder="write your name here "><br><br>
        <label> Last  name :</label>
        <input type="text" name ="Name" placeholder=" OPTIONAL "><br><br>
        <label>Date of birth :</label>
        <input type="date" name="date"><br><br>
        <label>Enter your Email Address: </label>
        <input type="email" name="email" placeholder="Your Email"><br><br>
        <label> Your Password </label>
        <input type="password" name="password" placeholder="write your password">
        <center>
            <label><h3> Choose Your Book Catogory 📖  : </h3></label>
            <select style="width: 85px ; height: 45px;">
                <option value="Fiction">Fiction</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Historical">Historical</option>
                <option value="Comedy">Comedy</option>
                <option value="Fantacy">Fantacy</option>
            </select>
            <label> Book Condition✨</label><br>
        <input type="radio" name="condition" >Like New<br>
        <input type="radio" name="condition" >Old<br>
        <input type="radio" name="condition" >Simple<br>

        </center><br>
        <label> Choose your day to submit 😀 </lable><br>
            <input type="checkbox" name="day">Monday<br>
            <input type="checkbox" name="day">Tuesday<br>
            <input type="checkbox" name="day">Wednesday<br>
            <input type="checkbox" name="day">Thursday<br>
            <input type="checkbox" name="day">Friday<br>
            <label>Submit here !</label>
            <input type="text" name="details" placeholder=" write the address"><br>
            <button style="background-color: bisque;"> SUBMIT </button><br>
            <center>
            <label> What's your experience in this website 🤔 </label>
             <textarea rows="3" cols="40">
            </textarea>
            <button>SEND</button>
            </center>
        </form>
    </body>
    </html></body>
