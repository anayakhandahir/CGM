<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Super Hero Card</title>
    <style>
    *{
     background-color:grey;
     font-family: Arial, Helvetica, sans-serif;
     font-size:35px;
     color:white;
    }
    h1{
        font-size:50px;
        transform:rotate(5deg);
        text-shadow:5px 6px rgb(0, 208, 255);
    }
    h2{
        font-weight:bold;
    }
    .line{
        text-decoration:line-through;
    }
    h3{
        text-transform:uppercase;
    }
    
    </style>
</head>
<body>
    
    <center>
    <h1>Thunderstorm</h1>
    <h2>Powers</h2>
    
      <h3> Bravery</h3>
     <h3> Flights</h3> 
     <h2>Weekness</h2>
     <h3 class="line">Vegetables specially brocolli.</h3>
   
   
</body>
</html>
